<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17142e">
<title>Swipe Right on NYC</title>
<meta name="description" content="Swipe on NYC neighborhoods like a dating app. Real NYC Open Data, funny profiles, one match.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%9A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header class="top" id="top" hidden>
    <button class="icon-btn" id="btn-back" aria-label="Back">‹</button>
    <div class="brand" id="brand"><span class="logo" aria-hidden="true">🔥</span><div><strong>Swipe Right on NYC</strong><small>CIVIC COMPATIBILITY DECK</small></div></div>
    <div class="top-right" id="top-right"></div>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <nav class="tabs" id="tabs" aria-label="Sections" hidden>
    <button data-tab="swipe">Swipe</button>
    <button data-tab="matches">Matches</button>
    <button data-tab="chats">Chats</button>
  </nav>

  <footer class="foot" id="foot">
    <span id="foot-text"></span>
    <button class="link" id="btn-sources">Data sources</button>
  </footer>

  <div class="sheet-wrap" id="sheet-wrap" hidden>
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></section>
  </div>

  <div class="pop" id="pop" role="tooltip" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>

<noscript><p style="padding:24px">This app needs JavaScript. It runs fully offline: just open index.html.</p></noscript>

<script src="data/neighborhoods.js"></script>
<script src="data/profiles.js"></script>
<script src="data/photos.js"></script>
<script src="logic.js"></script>
<script src="art.js"></script>
<script src="chat.js"></script>
<script src="app.js"></script>
</body>
</html>
